[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-guidance-agent"
version = "0.1.0"
description = "Bounded personal-health guidance agent: one-sentence member request to a governed, coach-approved guidance draft, with a deterministic guardrail, human gates, and a FastAPI backend."
requires-python = ">=3.11"
dependencies = ["fastapi", "httpx", "uvicorn"]

[project.optional-dependencies]
live = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
